<svg width="96" height="96" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Logo kucing satu garis dengan cahaya yang berputar melalui cincin di ujung ekor</title>
  <style>
    .l{fill:none;stroke-width:1.6;stroke-linejoin:miter;stroke-miterlimit:4;stroke-linecap:butt}
    .base{stroke:#B04E0E}
    .tl{stroke:#F0701A}
    .hd{stroke:#FFD98A}
    .an{animation-duration:1.8s;animation-iteration-count:infinite;animation-timing-function:linear}
    .t{stroke-dasharray:7 93;animation-name:tt}
    .h{stroke-dasharray:3 97;animation-name:th}
    @keyframes tt{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
    @keyframes th{from{stroke-dashoffset:-4}to{stroke-dashoffset:-104}}
  </style>

