  <path class="l an hd h" pathLength="100" d="M2.5 14.5A1.5 1.5 0 0 1 2.5 11.5A1.5 1.5 0 0 1 2.5 14.5V19L4.5 21H18L19 20V18L17 16V13L20 10V4L19 3L15 7H9L5 3L4 4V10L7 13V21H4.5L2.5 19Z"/>
