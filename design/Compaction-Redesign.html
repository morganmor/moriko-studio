<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compaction Checkpoint — Redesign</title>
<style>
  :root{
    color-scheme: dark light;
    --bg:#090c0a;
    --surface:#0e1410;
    --surface-2:#131b16;
    --line:rgba(120,255,170,.11);
    --line-strong:rgba(120,255,170,.26);
    --text:#d8e5dd;
    --muted:#85968b;
    --accent:#4ade80;
    --accent-soft:rgba(74,222,128,.10);
    --danger:#f87171;
    --chip:rgba(255,255,255,.04);
    --hover:rgba(255,255,255,.06);
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f3f6f4; --surface:#ffffff; --surface-2:#f5f9f6;
      --line:rgba(16,80,48,.12); --line-strong:rgba(16,120,66,.32);
      --text:#15231b; --muted:#5a6c61; --accent:#15803d;
      --accent-soft:rgba(21,128,61,.09); --danger:#dc2626;
      --chip:rgba(0,0,0,.04); --hover:rgba(0,0,0,.05);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:40px 16px 80px; color:var(--text); font-family:var(--sans);
    background:radial-gradient(900px 400px at 50% -10%,rgba(74,222,128,.07),transparent),var(--bg);
    min-height:100vh;
  }
  .chat{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .msg{margin:0;font-size:14.5px;line-height:1.65}
  .msg code{font:12.5px var(--mono);padding:2px 6px;border-radius:6px;background:var(--chip);border:1px solid var(--line)}

  /* ---------- Marker pemisah ---------- */
  .cp{margin:10px 0}
  .cp-marker{display:flex;align-items:center;gap:12px;margin-bottom:10px;
    font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .cp-marker::before,.cp-marker::after{content:"";height:1px;flex:1}
  .cp-marker::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
  .cp-marker::after{background:linear-gradient(270deg,transparent,var(--line-strong))}
  .cp-marker span{display:inline-flex;align-items:center;gap:8px}
  .cp-marker i{width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft),0 0 12px var(--accent)}

  /* ---------- Kartu ---------- */
  .cp-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.6);
    transition:border-color .2s}
  .cp-card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;
    background:linear-gradient(180deg,var(--accent),transparent 85%)}
  .cp-card:hover,.cp-card[data-open="true"]{border-color:var(--line-strong)}

  .cp-head{display:flex;align-items:stretch}
  .cp-toggle{appearance:none;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;
    flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:13px 8px 13px 18px;border-radius:12px 0 0 0}
  .cp-toggle:focus-visible,.icon-btn:focus-visible,.btn:focus-visible,.toc:focus-visible,.sec-head:focus-visible,.more:focus-visible{
    outline:2px solid var(--accent);outline-offset:-2px}
  .cp-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;
    color:var(--accent);background:var(--accent-soft);border:1px solid var(--line);transition:border-color .2s}
  .cp-head:hover .cp-ico{border-color:var(--line-strong)}
  .cp-titles{min-width:0;display:flex;flex-direction:column;gap:3px}
  .cp-title{font:600 13.5px/1.2 var(--sans);letter-spacing:.01em}
  .cp-sub{font:12px/1.3 var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cp-chips{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .chip{font:500 11px/1 var(--mono);padding:5px 8px;border-radius:999px;white-space:nowrap;
    color:var(--muted);background:var(--chip);border:1px solid var(--line)}
  .chip b{color:var(--text);font-weight:600}
  .chip.accent{background:var(--accent-soft);border-color:var(--line-strong);color:var(--accent)}
  .chip.accent b{color:var(--accent)}

  .cp-actions{display:flex;align-items:center;gap:2px;padding:0 10px 0 4px}
  .icon-btn{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
    width:30px;height:30px;border-radius:8px;display:grid;place-items:center;transition:background .15s,color .15s}
  .icon-btn:hover{background:var(--hover);color:var(--text)}
  .icon-btn.danger:hover{color:var(--danger);background:rgba(248,113,113,.1)}
  .icon-btn.ok{color:var(--accent)}
  .chev svg{transition:transform .25s}
  .cp-card[data-open="true"] .chev svg{transform:rotate(180deg)}

  .btn{appearance:none;font:500 12px var(--sans);padding:6px 11px;border-radius:8px;cursor:pointer;
    color:var(--text);background:var(--chip);border:1px solid var(--line);transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--line-strong)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--text);background:var(--hover)}
  .btn.danger{color:var(--danger);border-color:rgba(248,113,113,.35)}
  .btn.danger:hover{background:rgba(248,113,113,.1)}

  /* ---------- Konfirmasi hapus ---------- */
  .cp-confirm{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;
    border-top:1px solid rgba(248,113,113,.25);background:rgba(248,113,113,.06);font:12.5px var(--sans)}
  .cp-confirm span{flex:1;min-width:180px}
  .cp-card[data-confirm="true"] .cp-confirm{display:flex}

  /* ---------- Peek (kondisi tertutup) ---------- */
  .cp-peek{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
  .cp-card[data-open="true"] .cp-peek{grid-template-rows:0fr}
  .cp-peek-inner{overflow:hidden;min-height:0}
  .cp-peek-pad{padding:0 18px 15px 64px}
  .cp-lead{appearance:none;background:none;border:0;padding:0;cursor:pointer;text-align:left;
    color:var(--muted);font:13px/1.6 var(--sans);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cp-lead:hover{color:var(--text)}
  .cp-toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .toc{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    font:500 11.5px var(--mono);color:var(--muted);background:var(--chip);
    border:1px solid var(--line);border-radius:999px;padding:5px 10px;transition:.15s}
  .toc span{color:var(--accent);opacity:.85}
  .toc:hover{color:var(--text);border-color:var(--line-strong)}

  /* ---------- Body (kondisi terbuka) ---------- */
  .cp-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .cp-card[data-open="true"] .cp-body{grid-template-rows:1fr}
  .cp-body-inner{overflow:hidden;min-height:0;border-top:1px solid var(--line)}
  .cp-card[data-open="false"] .cp-body-inner{border-top-color:transparent}
  .cp-scroll{position:relative;max-height:min(62vh,520px);overflow:auto;padding:4px 18px 16px 22px;
    scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);
            mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent)}
  .sec{border-top:1px solid var(--line)}
  .sec:first-child{border-top:0}
  .sec-head{appearance:none;background:none;border:0;width:100%;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:10px;padding:14px 0 10px;
    font:600 11.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
  .sec-num{color:var(--muted);font-weight:500}
  .sec-count{margin-left:auto;color:var(--muted);font-weight:500}
  .sec-chev{display:grid;color:var(--muted);transition:transform .2s}
  .sec[data-collapsed="true"] .sec-chev{transform:rotate(-90deg)}
  .sec-list{list-style:none;margin:0;padding:0 0 14px;display:grid;gap:11px}
  .sec[data-collapsed="true"] .sec-list{display:none}

  .item{position:relative;padding-left:16px;font:13.5px/1.7 var(--sans)}
  .item::before{content:"";position:absolute;left:2px;top:.78em;width:5px;height:5px;border-radius:50%;
    background:var(--accent);opacity:.55}
  .item.clamp .item-text{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .lead-in{font:600 11px var(--mono);letter-spacing:.03em;color:var(--accent);margin-right:8px;
    padding:2px 7px;border-radius:6px;background:var(--accent-soft);white-space:nowrap}
  .item-text q{quotes:none;font-style:normal;padding:1px 5px;border-radius:5px;background:var(--accent-soft);
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  .item-text q::before{content:"“";color:var(--accent)}
  .item-text q::after{content:"”";color:var(--accent)}
  .item-text code{font:12px var(--mono);padding:2px 6px;border-radius:6px;color:var(--accent);
    background:var(--chip);border:1px solid var(--line)}
  .more{appearance:none;background:none;border:0;padding:0;margin-top:5px;cursor:pointer;
    color:var(--accent);font:500 12px var(--sans)}
  .more:hover{text-decoration:underline}

  .cp-foot{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
  .cp-foot .hint{margin-left:auto;font:11.5px var(--sans);color:var(--muted);padding:0 6px}

  /* ---------- Setelah dihapus ---------- */
  .cp-deleted{display:none;align-items:center;gap:10px;padding:11px 16px;border:1px dashed var(--line-strong);
    border-radius:12px;color:var(--muted);font:12.5px var(--sans)}
  .cp-deleted span{flex:1}
  .cp[data-state="deleted"] .cp-card,.cp[data-state="deleted"] .cp-marker{display:none}
  .cp[data-state="deleted"] .cp-deleted{display:flex}

  @media (max-width:560px){
    .cp-toggle{flex-wrap:wrap;row-gap:10px}
    .cp-chips{order:3;flex-basis:100%;margin-left:46px;justify-content:flex-start}
    .cp-peek-pad{padding-left:18px}
    .cp-foot .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main class="chat">
  <p class="msg">Satu hal saja: game-nya sudah selesai dan bisa kamu mainkan kapan pun — buka <code>subway-fps/index.html</code> (klik dua kali) di browser. Kontrol: WASD + mouse, klik kiri tembak, R reload, 1/2 ganti senjata.</p>
  <p class="msg">Kalau nanti mau dilanjutkan (perbaikan, preview di chat, atau apa pun), tinggal bilang.</p>

  <div id="checkpoint"></div>
</main>

<!-- Isi ringkasan (markdown sederhana). Ganti dengan data asli dari aplikasimu. -->
<script type="text/plain" id="sample">
## Primary Request and Intent
- Original (Indonesian): "Buat game 2D canvas sederhana" — a simple 2D canvas game. Delivered as "Owl & Stars" (`game/index.html`), verified, goal marked done.
- Follow-up: "Buat demo 3D di visual" — a 3D demo rendered as an inline chat card. Delivered as a dependency-free software-3D canvas planet (`demo-3d/index.html`); the three.js version failed because harness vendor injection never set `window.THREE`.
- Main request (verbatim): "Make a beautifully detailed web scene using js, of a subway station with focus on detail. It should be 3D and something that would be impressive to you. The scene must be the setting for an FPS with humanoid/zombieoid enemies, visible ammo tracers, weapon recoil, at least two different weapons, muzzle flash, sfx and high detail. The first wave should be simple. When the first wave is cleared, a train should pull into the station that the player enters. The train then closes its open doors to bring you to the next station for wave 2, with difficulty increasing until the player loses. use threejs and create the result as something playable in the browser"
- Latest instruction (verbatim, twice): "Berhenti menjalankan probe, saya lag" — stop running probes; the machine is lagging. All probes/servers were stopped and temp artifacts deleted.

## Current State
- Game finished and playable: open `subway-fps/index.html` (double-click) in the browser.
- Controls: WASD + mouse, left click to shoot, R to reload, 1/2 to switch weapons.
- Open follow-ups: fixes, in-chat preview, or anything else the user asks for.
</script>

<script>
(() => {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const svg = (d, s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICON = {
    archive: svg('<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>', 17),
    copy:    svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
    check:   svg('<path d="M20 6 9 17l-5-5"/>'),
    trash:   svg('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>'),
    chev:    svg('<path d="m6 9 6 6 6-6"/>'),
    chevS:   svg('<path d="m6 9 6 6 6-6"/>', 14)
  };

  /* Markdown ringan -> [{title, items[]}] */
  function parse(text) {
    const out = []; let cur = null;
    const ensure = () => cur || (cur = { title: 'Ringkasan', items: [] }, out.push(cur), cur);
    for (const line of text.split(/\r?\n/)) {
      const h = line.match(/^#{1,4}\s+(.+?)\s*$/);
      if (h) { cur = { title: h[1], items: [] }; out.push(cur); continue; }
      const b = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.+?)\s*$/);
      if (b) { ensure().items.push(b[1]); continue; }
      const t = line.trim();
      if (!t) continue;
      const s = ensure();
      if (s.items.length && /^\s{2,}/.test(line)) s.items[s.items.length - 1] += ' ' + t;
      else s.items.push(t);
    }
    return out.filter(s => s.items.length);
  }

  const plain = s => s.replace(/`([^`]+)`/g, '$1').replace(/\*\*([^*]+)\*\*/g, '$1');

  function inline(raw) {
    let lead = '', s = raw;
    const m = s.match(/^([A-Z][^:"`]{1,44}):\s+/);          // "Label: isi" -> label berwarna
    if (m) { lead = `<span class="lead-in">${esc(m[1])}</span>`; s = s.slice(m[0].length); }
    s = esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/"([^"]{2,})"/g, '<q>$1</q>');               // kutipan verbatim disorot
    return lead + s;
  }

  const itemHTML = raw => {
    const long = raw.length > 230;
    return `<li class="item${long ? ' clamp' : ''}"><div class="item-text">${inline(raw)}</div>` +
      (long ? '<button class="more" data-act="more" aria-expanded="false">Selengkapnya</button>' : '') + '</li>';
  };

  let counter = 0;

  function mount(root, data) {
    const id = 'cp' + (++counter);
    const sections = parse(data.text || '');
    const lead = data.lead || plain(sections[0] ? sections[0].items[0] : '');
    const pad = n => String(n + 1).padStart(2, '0');
    const mode = data.mode || 'manual';

    root.className = 'cp';
    root.innerHTML = `
      <div class="cp-marker"><span><i></i>Konteks dipadatkan</span></div>
      <article class="cp-card" data-open="false" data-confirm="false">
        <header class="cp-head">
          <button class="cp-toggle" data-act="toggle" aria-expanded="false" aria-controls="${id}-body">
            <span class="cp-ico">${ICON.archive}</span>
            <span class="cp-titles">
              <span class="cp-title">Compaction checkpoint</span>
              <span class="cp-sub">Ringkasan konteks sebelumnya</span>
            </span>
            <span class="cp-chips">
              <span class="chip accent"><b>${esc(String(data.tokens))}</b> tok</span>
              <span class="chip"><b>${esc(String(data.turns))}</b> turns</span>
              <span class="chip">${esc(mode)}</span>
            </span>
          </button>
          <div class="cp-actions">
            <button class="icon-btn" data-act="copy" title="Salin ringkasan" aria-label="Salin ringkasan">${ICON.copy}</button>
            <button class="icon-btn danger" data-act="delete" title="Hapus checkpoint" aria-label="Hapus checkpoint">${ICON.trash}</button>
            <button class="icon-btn chev" data-act="toggle" tabindex="-1" aria-hidden="true">${ICON.chev}</button>
          </div>
        </header>

        <div class="cp-confirm" role="group" aria-label="Konfirmasi hapus">
          <span>Hapus checkpoint ini dari konteks?</span>
          <button class="btn danger" data-act="confirm-delete">Hapus</button>
          <button class="btn" data-act="cancel-delete">Batal</button>
        </div>

        <div class="cp-peek"><div class="cp-peek-inner"><div class="cp-peek-pad">
          <button class="cp-lead" data-act="toggle" tabindex="-1">${esc(lead)}</button>
          <div class="cp-toc">${sections.map((s, i) =>
            `<button class="toc" data-act="toc" data-i="${i}"><span>${pad(i)}</span>${esc(s.title)}</button>`).join('')}</div>
        </div></div></div>

        <div class="cp-body" id="${id}-body"><div class="cp-body-inner" inert>
          <div class="cp-scroll">${sections.map((s, i) => `
            <section class="sec" data-collapsed="false">
              <button class="sec-head" data-act="sec" aria-expanded="true">
                <span class="sec-num">${pad(i)}</span><span>${esc(s.title)}</span>
                <span class="sec-count">${s.items.length}</span>
                <span class="sec-chev">${ICON.chevS}</span>
              </button>
              <ul class="sec-list">${s.items.map(itemHTML).join('')}</ul>
            </section>`).join('')}
          </div>
          <footer class="cp-foot">
            <button class="btn ghost" data-act="expand-all">Buka semua</button>
            <button class="btn ghost" data-act="collapse-all">Tutup semua</button>
            <span class="hint">Menggantikan ${esc(String(data.turns))} turn sebelumnya di konteks</span>
          </footer>
        </div></div>
      </article>

      <div class="cp-deleted"><span>Checkpoint dihapus dari konteks.</span>
        <button class="btn" data-act="undo">Urungkan</button></div>`;

    const q = s => root.querySelector(s);
    const card = q('.cp-card'), toggleBtn = q('.cp-toggle');
    const bodyInner = q('.cp-body-inner'), peekInner = q('.cp-peek-inner');
    const scroller = q('.cp-scroll');
    const secs = [...root.querySelectorAll('.sec')];
    let open = false;

    const setOpen = v => {
      open = v;
      card.dataset.open = String(v);
      toggleBtn.setAttribute('aria-expanded', String(v));
      bodyInner.inert = !v;
      peekInner.inert = v;
    };
    const setSec = (sec, collapsed) => {
      sec.dataset.collapsed = String(collapsed);
      sec.querySelector('.sec-head').setAttribute('aria-expanded', String(!collapsed));
    };
    const copy = async btn => {
      try { await navigator.clipboard.writeText(data.text); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = data.text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      btn.innerHTML = ICON.check; btn.classList.add('ok'); btn.setAttribute('aria-label', 'Tersalin');
      setTimeout(() => { btn.innerHTML = ICON.copy; btn.classList.remove('ok'); btn.setAttribute('aria-label', 'Salin ringkasan'); }, 1400);
    };

    root.addEventListener('click', e => {
      const t = e.target.closest('[data-act]');
      if (!t || !root.contains(t)) return;
      switch (t.dataset.act) {
        case 'toggle': setOpen(!open); break;
        case 'toc': {
          const sec = secs[+t.dataset.i];
          setOpen(true); setSec(sec, false);
          setTimeout(() => scroller.scrollTo({ top: Math.max(sec.offsetTop - 6, 0), behavior: 'smooth' }), 80);
          break;
        }
        case 'sec': setSec(t.closest('.sec'), t.getAttribute('aria-expanded') === 'true'); break;
        case 'more': {
          const li = t.closest('.item');
          const clamped = li.classList.toggle('clamp');
          t.textContent = clamped ? 'Selengkapnya' : 'Ringkas';
          t.setAttribute('aria-expanded', String(!clamped));
          break;
        }
        case 'copy': copy(t); break;
        case 'delete': card.dataset.confirm = 'true'; q('[data-act="cancel-delete"]').focus(); break;
        case 'cancel-delete': card.dataset.confirm = 'false'; q('[data-act="delete"]').focus(); break;
        case 'confirm-delete':
          card.dataset.confirm = 'false'; root.dataset.state = 'deleted';
          root.dispatchEvent(new CustomEvent('checkpoint:delete'));
          q('[data-act="undo"]').focus(); break;
        case 'undo':
          root.dataset.state = '';
          root.dispatchEvent(new CustomEvent('checkpoint:restore'));
          toggleBtn.focus(); break;
        case 'expand-all': secs.forEach(s => setSec(s, false)); break;
        case 'collapse-all': secs.forEach(s => setSec(s, true)); break;
      }
    });
    root.addEventListener('keydown', e => {
      if (e.key === 'Escape' && card.dataset.confirm === 'true') { card.dataset.confirm = 'false'; q('[data-act="delete"]').focus(); }
    });

    setOpen(!!data.open);
    return { open: () => setOpen(true), close: () => setOpen(false) };
  }

  window.CompactionCheckpoint = { mount };

  /* Demo */
  CompactionCheckpoint.mount(document.getElementById('checkpoint'), {
    tokens: '~6k',
    turns: 15,
