<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moriko Browser — Live Panel</title>
    <style>
      /* Critical CSS inline: the panel must paint its frame chrome before the
         JS bundle arrives — a white flash in a dark theme reads as broken. */
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #17181b; color: #eef0f5; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/browser-view-main.tsx"></script>
  </body>
</html>
